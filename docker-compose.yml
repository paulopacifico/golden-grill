services:
  api:
    build:
      context: ./GoldenGrill.Api
    container_name: golden-grill-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/golden-grill.db"
    volumes:
      - api-data:/app/data
    expose:
      - "8080"
    restart: unless-stopped

  web:
    build:
      context: ./GoldenGrill-Web
    container_name: golden-grill-web
    depends_on:
      - api
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  api-data:
