<section class="min-h-screen bg-zinc-950 flex items-center justify-center px-6">
  <div class="max-w-md w-full text-center space-y-6">

    <div class="w-20 h-20 bg-yellow-400/10 rounded-full flex items-center justify-center mx-auto">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
      </svg>
    </div>

    <div>
      <h1 class="text-3xl font-bold text-white">Pedido confirmado!</h1>
      <p class="mt-2 text-zinc-400">Seu pedido foi recebido e está sendo preparado.</p>
    </div>

    @if (orderId) {
      <div class="bg-zinc-900 border border-zinc-800 rounded-2xl p-5 space-y-2 text-left">
        <div class="flex justify-between text-sm">
          <span class="text-zinc-400">Número do pedido</span>
          <span class="text-white font-semibold">#{{ orderId }}</span>
        </div>
        @if (total) {
          <div class="flex justify-between text-sm">
            <span class="text-zinc-400">Total pago</span>
            <span class="text-yellow-400 font-bold">R$ {{ total.toFixed(2) }}</span>
          </div>
        }
      </div>
    }

    <button
      (click)="backToMenu()"
      class="w-full bg-yellow-400 hover:bg-yellow-300 active:scale-95 text-black font-bold py-3 rounded-xl transition-all duration-150"
    >
      Voltar ao Cardápio
    </button>

  </div>
</section>
