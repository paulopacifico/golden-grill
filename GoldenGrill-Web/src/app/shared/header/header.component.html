<header class="sticky top-0 z-40 bg-zinc-950/90 backdrop-blur border-b border-zinc-800">
  <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">

    <div class="flex items-center gap-2">
      <span class="text-2xl">🍔</span>
      <span class="text-xl font-bold text-yellow-400 tracking-tight">Golden Grill</span>
    </div>

    <button
      (click)="openCart()"
      class="relative flex items-center gap-2 bg-zinc-900 hover:bg-zinc-800 border border-zinc-700 hover:border-yellow-500 text-white px-4 py-2 rounded-xl transition-colors duration-150"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
          d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
      </svg>
      <span class="text-sm font-medium">Carrinho</span>
      @if (itemCount() > 0) {
        <span class="absolute -top-2 -right-2 bg-yellow-400 text-black text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">
          {{ itemCount() }}
        </span>
      }
    </button>

  </div>
</header>
